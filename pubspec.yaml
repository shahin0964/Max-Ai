name: max_ai
description: "Max AI - Futuristic Hybrid On-Device & Cloud AI Assistant powered by OpenJarvis Architecture"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.4.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  flutter_markdown_plus: ^1.0.12
  intl: ^0.20.3
  uuid: ^4.6.0
  crypto: ^3.0.6
  url_launcher: ^6.3.0
  permission_handler: ^12.0.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
