name: Build and Release Max AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Max AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Compute Dynamic Version
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0"
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Setup Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          SECRET_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || secrets.KEY_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.KEY_NAME || secrets.ALIAS }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/release.jks
            cp android/app/release.jks android/release.jks
            echo "Keystore successfully decoded to android/app/release.jks"
            echo "KEYSTORE_PASSWORD=${SECRET_STORE_PASS:-AbdurRahman321@@}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${SECRET_KEY_ALIAS:-maxai}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${SECRET_KEY_PASS:-AbdurRahman321@@}" >> $GITHUB_ENV
          else
            echo "KEYSTORE_BASE64 is empty, creating signing keystore"
            keytool -genkeypair -v -keystore android/app/release.jks -alias maxai -keyalg RSA -keysize 2048 -validity 10000 -storepass AbdurRahman321@@ -keypass AbdurRahman321@@ -dname "CN=MaxAI, O=MaxAI, C=BD"
            cp android/app/release.jks android/release.jks
            echo "KEYSTORE_PASSWORD=AbdurRahman321@@" >> $GITHUB_ENV
            echo "KEY_ALIAS=maxai" >> $GITHUB_ENV
            echo "KEY_PASSWORD=AbdurRahman321@@" >> $GITHUB_ENV
          fi

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release --build-name=${{ env.VERSION_NAME }} --build-number=${{ env.VERSION_CODE }}
          echo "APK_DIR=build/app/outputs/flutter-apk" >> $GITHUB_ENV

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk MaxAI-release-v${{ env.VERSION_NAME }}.${{ env.VERSION_CODE }}.apk
          echo "APK_PATH=MaxAI-release-v${{ env.VERSION_NAME }}.${{ env.VERSION_CODE }}.apk" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v${{ env.VERSION_NAME }}.${{ env.VERSION_CODE }}
          name: "Max AI Release v${{ env.VERSION_NAME }}.${{ env.VERSION_CODE }}"
          body: |
            ### ⚡ Max AI - Next-Gen Autonomous AI Assistant
            Powered by OpenJarvis Architecture & Hybrid AI Providers (Gemini / Claude / OpenAI / Local Server).
            
            **What's inside:**
            - 🌌 Holographic 3D AI Reactor Canvas & Dynamic Voice visualizer
            - 🔄 Hybrid Multi-Provider engine (Local Ollama / OpenJarvis + Cloud APIs)
            - 🛠️ Autonomous ReAct Agent Loop with Live Tool Execution & Expandable Timelines
            - 🧠 Long-Term Episodic Memory & Semantic Knowledge Storage
            - 📊 Live Hardware & Engine Telemetry Monitor
            - ⚡ Instant Markdown & Syntax Highlighted Code Viewer
          files: |
            ${{ env.APK_PATH }}
          draft: false
          prerelease: false
