name: Build and Release Maya AI Assistant APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Release Keystore
      run: |
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "Decoding release keystore..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks
          ls -lh app/keystore.jks
        else
          echo "Warning: KEYSTORE_BASE64 secret is empty, proceeding with debug build..."
        fi

    - name: Build APK
      run: |
        if [ -f app/keystore.jks ]; then
          echo "Keystore detected! Building Signed Release APK..."
          ./gradlew assembleRelease --stacktrace
        else
          echo "No keystore detected, building Debug APK..."
          ./gradlew assembleDebug --stacktrace
        fi
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Prepare Release APK
      run: |
        mkdir -p release-artifacts
        if [ -f app/build/outputs/apk/release/app-release.apk ]; then
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/Maya-AI-v5.2.63.apk
        elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-artifacts/Maya-AI-v5.2.63.apk
        else
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/Maya-AI-v5.2.63.apk
        fi
        ls -lh release-artifacts/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Maya-AI-v5.2.63-APK
        path: release-artifacts/Maya-AI-v5.2.63.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: "Maya AI Assistant ${{ github.ref_name }}"
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ## 🎙️ Maya AI Assistant (${{ github.ref_name }})
          **Autonomous On-Device AI Voice Agent & Android Controller**

          ### ✨ Features:
          - 🧠 **Multi-Turn Agentic Brain**: Multi-model support (Groq Llama 3.3 70B, Google Gemini, OpenRouter) with autonomous tool calling.
          - 🎙️ **Exact Maya Voice Pipeline**:
            - Real-time on-device Voice Activity Detection (Silero VAD)
            - DTLN Acoustic Echo Cancellation (AEC)
            - TFLite Wakeword Detector ("Hey Maya", "Hello Maya")
            - Three Personas: **Maya** (Multilingual conversational), **Friday** (Tactical assistant), and **Venom** (Bold AI companion).
          - 💻 **Termux Live Automation**: Dispatches bash scripts via `com.termux.permission.RUN_COMMAND` with a live terminal output reel.
          - 📱 **Screen Perception & A11y Driver**: Reads screen content and performs auto-taps and gestures.
          - 🛠️ **System Automation Hub**: WhatsApp messaging, phone calls, SMS, flashlight, and media volume control.
          - 🎨 **Jetpack Compose UI/UX**: Identical Maya Dark Theme, glowing reactive Voice Orb, Inter & JetBrains Mono typography.

          ### 📦 Download:
          Download `Maya-AI-v5.2.63.apk` below and install directly on your Android device!
        files: release-artifacts/Maya-AI-v5.2.63.apk
