name: Build and Release Aura Voice AI APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Prepare Release APK
      run: |
        mkdir -p release-artifacts
        cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/AuraVoice-AI.apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AuraVoice-AI-APK
        path: release-artifacts/AuraVoice-AI.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: "Aura Voice AI ${{ github.ref_name }}"
        draft: false
        prerelease: false
        generate_release_notes: false
        body: |
          ## 🎙️ Aura Voice AI (${{ github.ref_name }})
          **Jarvis-Style 3D Holographic Arc Reactor • 100% Offline On-Device AI**

          ### ✨ Key Features:
          - 🦾 **Jarvis Cockpit & 3D Arc Reactor**: Multi-axis rotating holographic 3D rings, plasma energy core, and audio-reactive frequency equalizers.
          - 🚫 **No API Key & 100% Offline**: Runs on-device with zero internet or cloud dependency.
          - 🧠 **Continuous Learning & Memory**: Automatically extracts facts & user preferences into local SQLite storage.
          - 👂 **Continuous Voice Activation**: Stabilized voice listener preventing disconnect loops.
          - ⚡ **ROG Phone 7 Optimized**: High-speed Snapdragon 8 Gen 2 inference.

          ### 📦 Installation:
          Download `AuraVoice-AI.apk` below and install directly on your Android phone.
        files: release-artifacts/AuraVoice-AI.apk
