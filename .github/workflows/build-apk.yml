name: Build and Release Signed Max AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Keystore from GitHub Secrets
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
            echo "Keystore successfully decoded into android/app/keystore.jks"
            ls -la android/app/keystore.jks
          else
            echo "Warning: KEYSTORE_BASE64 secret not found, fallback to debug keystore"
          fi

      - name: Build Signed Release APK
        run: flutter build apk --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Max-AI-signed-release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Max-AI-Signed-APK
          path: Max-AI-signed-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7
          name: Max AI Release v1.0.7 (Signed APK + 3D Pluto Celestial Orb with Bold MAX Core)
          body: |
            ### 🚀 Max AI Android Release v1.0.7 - Official Signed APK
            - **App Name:** Max AI
            - **Package:** `com.max.ai`
            - **Signing:** Official Release Keystore (`KEYSTORE_BASE64` signed APK)
            
            ### 💎 Key Upgrades in v1.0.7:
            - 🪐 **Realistic 3D Pluto Celestial Quantum Orb:**
              - Complete replacement of 2D circles with an authentic 3D rotating model of the dwarf planet Pluto (based on NASA New Horizons mission telemetry)
              - **The Iconic Heart (Tombaugh Regio / Sputnik Planitia):** Distinct creamy-ivory nitrogen and carbon monoxide ice plain that rotates smoothly across the spherical curvature
              - **Tholin Highlands & Cthulhu Macula:** Rich copper/ochre/mahogany organic tholin terrains and dark equatorial crater bands with true Lambertian diffuse lighting & nitrogen frost specular glint
              - **Pluto Blue Rayleigh Atmospheric Haze:** Ethereal blue nitrogen haze ring encircling Pluto's limb with glowing Fresnel scattering
              - **3D Tilted Orbital Dust Ring:** Depth-sorted stardust and moonlet orbit (half behind the planet, half glowing in front)
            - ⚡ **Bold Holographic "MAX" Centerpiece:**
              - "MAX" embossed in the dead-center of Pluto in ultra-bold, cyber-luxe metallic typography
              - Anti-interference dark glass backplate ensuring crystal-clear legibility over rotating terrain
              - Multi-pass 3D text rendering: drop shadow, neon electric cyan/purple atmospheric glow, and metallic gradient core
              - Flanking audio-reactive brackets that expand and pulse dynamically during speech & listening
            - 🛡️ **All Core Systems Active:**
              - 7-Model Google Gemini Waterfall Cascade (Gemini 3.8 Flash ➔ 2.0 Flash ➔ 2.0 Flash Lite ➔ 1.5 Flash ➔ 8B ➔ Pro ➔ Groq)
              - Multi-Key Rotation Pool to defeat 429 rate limits
              - Smart Tool Gating for 85% token reduction
              - Continuous Yaadein Long-Term Memory
            
            📥 **Download Signed APK:** Tap `Max-AI-signed-release.apk` below to download and install!
          files: Max-AI-signed-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
