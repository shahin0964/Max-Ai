name: Build and Release Max AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Max-AI-release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Max-AI-APK
          path: Max-AI-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: Max AI Release v1.0.2 (100% Functional UI, Vision AI & All Interactive Tools)
          body: |
            ### 🚀 Max AI Android Release v1.0.2 - 100% Functional Update
            - **App Name:** Max AI
            - **Package:** `com.max.ai`
            - **Engine:** Gemini 3.8 Flash + Local Autonomous Engine
            - **100% Functional Features & Interactive Screens:**
              - 👁️ **Vision AI Scanner (`VisionScreen`):** Multimodal image analysis with Gemini 3.8 Flash, cyber scanning laser HUD.
              - 🧠 **Continuous Long-term Memory Vault (`MemoryScreen`):** Search, add, delete, and manage facts and preferences.
              - 🛠️ **19 Extracted Tools Manager & Playground (`ToolsManagerScreen`):** Interactive parameter input and instant live test runner for all 19 tools!
              - 💻 **Termux Live Terminal Reel (`TerminalReelScreen`):** Interactive in-app bash terminal with retro green phosphor console and quick command chips!
              - 🎙️ **Interactive Voice Mode (`VoiceScreen`):** Real-time voice animation, transcription, quick voice prompts, and Gemini 3.8 verbal readout!
              - ⚙️ **All Settings 100% Functional (`SettingsScreen`):**
                - Editable User Profile (Name & Email saved in SharedPreferences)
                - Language selector (English, বাংলা, हिन्दी)
                - Theme selector (Dark Neon, Cyberpunk Purple, AMOLED True Black)
                - Voice & Personality models (Maya, Friday, Venom)
                - Autonomous Voice Guardian biometrics & Wake Word toggles
                - Live Gemini API Key verification with latency & token counter
                - Backup & Restore JSON export
              - 📊 **Reply Details & Token Analytics:** Exact token usage popup (Input tokens, Output tokens, Cached tokens, Latency) in Chat.
              - 📅 **Dynamic Reminders:** Real upcoming reminder card on Home with instant reminder creation.
              - 👑 **Max AI Pro Perks:** Unlocked full autonomous capabilities modal.
            
            📥 **Download:** Tap `Max-AI-release.apk` below to download and update your app!
          files: Max-AI-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
