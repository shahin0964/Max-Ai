name: Build and Release Signed Max AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Keystore from GitHub Secrets
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
            echo "Keystore successfully decoded into android/app/keystore.jks"
            ls -la android/app/keystore.jks
          else
            echo "Warning: KEYSTORE_BASE64 secret not found, fallback to debug keystore"
          fi

      - name: Build Signed Release APK
        run: flutter build apk --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Max-AI-signed-release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Max-AI-Signed-APK
          path: Max-AI-signed-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: Max AI Release v1.0.6 (Signed APK + Brand New Obsidian Cyber-Glow UI + 7-Model Waterfall + Ultra Token Efficiency)
          body: |
            ### 🚀 Max AI Android Release v1.0.6 - Official Signed APK
            - **App Name:** Max AI
            - **Package:** `com.max.ai`
            - **Signing:** Official Release Keystore (`KEYSTORE_BASE64` signed APK)
            
            ### 💎 Key Upgrades in v1.0.6:
            - 🌌 **Brand New "Obsidian Cyber-Glow" UI Architecture:**
              - Complete removal of legacy designs in favor of a bespoke, futuristic AI interface
              - Deep OLED Obsidian backdrop (`#07090E`) with dynamic cyan and violet ambient radial glow
              - **Quantum Voice Core Centerpiece:** Animated multi-ring interactive holographic sphere with ripple waves and live breathing states (Idle, Listening, Thinking, Speaking)
              - **Floating Capability Horizon:** Instant access chips for `Chat Now`, `Vision AI`, `Yaadein Memory`, `Termux Console`, and `19 Tools`
              - **Floating Command Deck:** Integrated bottom deck with Quick Action (+), dynamic text field, Pulsing Mic button, and Swift Send
              - **Sleek 4-Tab Floating Dock:** `Core`, `Chat`, `Studio`, and `Settings`
              - **Messenger Chat Experience:** Frosted glass message bubbles with avatar `M`, real-time typing indicator (`• • •`), one-tap clipboard copy, double checkmarks, and token metric badges
            - ⚡ **7-Model Google Gemini Waterfall Cascade:**
              - Starts with **`gemini-3.8-flash`** and automatically cascades across 7 models upon 429 quota, 503 spike, or 404/400 errors:
                1. `gemini-3.8-flash` (Primary Turbo)
                2. `gemini-2.0-flash` (1,500 requests/day free)
                3. `gemini-2.0-flash-lite` (1,500 requests/day free · Ultra Fast)
                4. `gemini-1.5-flash` (1,500 requests/day free · Stable)
                5. `gemini-1.5-flash-8b` (1,500 requests/day free · Lowest Token Cost)
                6. `gemini-2.0-pro-exp-02-05` (Deep Reasoning Fallback)
                7. `gemini-1.5-pro` (Reasoning Fallback)
                8. Groq API Fallback (`llama-3.3-70b-versatile` · 14,400 free requests/day)
              - Multi-Key Rotation Pool: Separate multiple keys with commas in Settings to multiply quota
            - 🧠 **Ultra-Low Token Consumption & Continuous Long-Term Memory (Yaadein):**
              - **Smart Action Gating:** Automatically omits 19 heavy tool declarations on conversational messages, slashing input tokens by 85% (from 1,300+ down to ~150 tokens!)
              - **Zero-Token Instant Memory:** Saying "remember [fact]" saves directly to local memory without spending API quota
              - **Autonomous Proactive Context:** Past memories automatically inject into context so Max AI remembers your identity and preferences without wasteful tool round-trips
            
            📥 **Download Signed APK:** Tap `Max-AI-signed-release.apk` below to download and install!
          files: Max-AI-signed-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
