name: Build and Release Signed Max AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Keystore from GitHub Secrets
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
            echo "Keystore successfully decoded into android/app/keystore.jks"
            ls -la android/app/keystore.jks
          else
            echo "Warning: KEYSTORE_BASE64 secret not found, fallback to debug keystore"
          fi

      - name: Build Signed Release APK
        run: flutter build apk --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Max-AI-signed-release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Max-AI-Signed-APK
          path: Max-AI-signed-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: Max AI Release v1.0.5 (Signed APK + Maya 1:1 Claymorphic UI + All Features Unlocked + Rate-Limit Liberation Pool)
          body: |
            ### 🚀 Max AI Android Release v1.0.5 - Official Signed APK
            - **App Name:** Max AI
            - **Package:** `com.max.ai`
            - **Signing:** Official Release Keystore (`KEYSTORE_BASE64` signed APK)
            
            ### 💎 UI & Feature Upgrades in v1.0.5:
            - 🌸 **Authentic Maya Claymorphic UI Engine (Video Match 1:1):**
              - Soft 3D Claymorphic light styling (`#EBF3FB`) with soft drop shadows and rounded clay cards
              - Animated RGB Rainbow edge glow frame wrapping around the device screen
              - Authentic Maya 3D Character (Red Dress) with instant toggle button to Holographic Voice Orb
              - Top Quick Action Pills: `♪ Gaane`, `📖 Padhai`, `✏️ Journal`
              - 3 Real-Time Status Cards: `💧 Mausam: 22° Showers, 96%`, `📅 Aaj: 21 Sat, Nov`, `🤍 Mood: Pyaar bh... Sab badhiya`
              - 5-Tab Clay Bottom Nav: `Home`, `Scan` (Vision HUD), Center Floating Blue Mic Orb, `Yaadein` (Macros/Tasks), `Chat`
              - Claymorphic Drawer matching `frame_014.jpg`: `KAAM-KAAJ` (Markets, Marketing, Documents, Meri photos, Website/Coding, Terminal, Browser, Accessibility), `SYSTEM` (Settings)
            - 🔓 **100% Unlocked VIP Features (Zero Activation Paywalls):**
              - All 10 Pro Max Wallpapers fully unlocked (Asleep at desk, The reaching hand, Jarvis, Maya Green/Red/Saree/Studio/Violet, Venom)
              - Advanced Agentic Voice Engine fully unlocked and operational
              - Intense (18+) Personality Mode fully unlocked
              - All Pro features accessible without activation codes or paywalls
            - ⚡ **Anti-Rate-Limit (429 & 503) Liberation:**
              - Multi-Key Rotation Pool: Enter multiple Gemini API keys separated by comma to multiply daily quota
              - Automatic Model Cascading: When `gemini-3.8-flash` hits its 20/day preview limit or 503 high demand spike, the app seamlessly cascades to `gemini-2.0-flash` (1,500 requests/day free!), `gemini-2.0-flash-lite`, and Groq API (14,400 requests/day free)
              - No more 429 quota exhaustion interruptions or 404 model errors
            
            📥 **Download Signed APK:** Tap `Max-AI-signed-release.apk` below to download and install!
          files: Max-AI-signed-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
