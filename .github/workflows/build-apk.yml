name: Build and Release Max AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Max-AI-release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Max-AI-APK
          path: Max-AI-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: Max AI Release v1.0.1 (Gemini 3.8 Flash + 19 Extracted Tools)
          body: |
            ### 🚀 Max AI Android Release v1.0.1
            - **App Name:** Max AI
            - **Package:** `com.max.ai`
            - **Model:** Google Gemini 3.8 Flash default
            - **Extracted Automation Tools (19 Tools):**
              - Termux Bash Command Execution (`termux_run`)
              - WhatsApp Send & Read Chat (`whatsapp_send_message`, `whatsapp_read_chat`)
              - Screen Automation (`tap_text`, `tap_coordinates`, `swipe_screen`, `read_screen_text`)
              - Built-in App Macros (`chatgpt image`, `gemini image`, `gemini video`)
              - Hardware Control (`set_torch`, `set_volume`, `make_call`, `send_sms`)
              - Media & Web (`play_youtube`, `spotify_play`, `get_weather`, `web_search`)
              - Continuous Memory (`save_memory`, `recall_memory`)
            - **Design:** Futuristic Neon Dark Glassmorphism UI
            
            📥 **Download:** Tap `Max-AI-release.apk` below to install directly on your Android phone!
          files: Max-AI-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
