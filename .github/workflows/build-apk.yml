name: Build and Release Signed Max AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Keystore from GitHub Secrets
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
            echo "Keystore successfully decoded into android/app/keystore.jks"
            ls -la android/app/keystore.jks
          else
            echo "Warning: KEYSTORE_BASE64 secret not found, fallback to debug keystore"
          fi

      - name: Build Signed Release APK
        run: flutter build apk --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Max-AI-signed-release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Max-AI-Signed-APK
          path: Max-AI-signed-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: Max AI Release v1.0.3 (Signed APK + Maya VoiceOrb UI + Audio & Gemini 503 Fixes)
          body: |
            ### 🚀 Max AI Android Release v1.0.3 - Official Signed APK
            - **App Name:** Max AI
            - **Package:** `com.max.ai`
            - **Signing:** Official Release Keystore (`KEYSTORE_BASE64` signed APK)
            
            ### 💎 UI & Feature Upgrades in v1.0.3:
            - 🔮 **Exact Maya AI UI Engine Replacement:**
              - Complete color system (`MayaBackground`, `MayaSurface`, `MayaAccentCyan`, `MayaPrimary`, `MayaAccentPink`, `TerminalGreen`)
              - Centerpiece **`VoiceOrb`** with authentic multi-layer concentric ripple rings & breathing states (Idle, Listening, Thinking, Speaking)
              - Header with `🟢 Active • Voice Guardian Ready` security status
              - 6 Interactive Device Tiles (`Flashlight`, `Media Volume`, `Termux Reel`, `WhatsApp`, `Vision AI`, `Memory Vault`)
              - 5-Tab Navigation (`Voice`, `Chat`, `Tools`, `Terminal`, `Settings`)
            - 🔊 **Voice Audio Previews Working 100%:**
              - Extracted authentic `.ogg` voice models (`maya_Aoede.ogg`, `friday_Aoede.ogg`, `venom_Fenrir.ogg`)
              - Native Android `MediaPlayer` integration with TextToSpeech fallback
            - 🛡️ **Gemini 503 & High Demand Auto-Recovery:**
              - Automatic resilience & fallback to `gemini-2.5-flash` or `gemini-2.0-flash`
              - "Test Connection & Latency" button guaranteed to test and report successfully without getting stuck
            
            📥 **Download Signed APK:** Tap `Max-AI-signed-release.apk` below to download and install!
          files: Max-AI-signed-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
