name: Build and Release Signed Max AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Keystore from GitHub Secrets
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
            echo "Keystore successfully decoded into android/app/keystore.jks"
            ls -la android/app/keystore.jks
          else
            echo "Warning: KEYSTORE_BASE64 secret not found, fallback to debug keystore"
          fi

      - name: Build Signed Release APK
        run: flutter build apk --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Max-AI-signed-release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Max-AI-Signed-APK
          path: Max-AI-signed-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: Max AI Release v1.0.4 (Signed APK + Messenger UI + Clean Voice Home + Gemini 3.8 Flash Exclusive)
          body: |
            ### 🚀 Max AI Android Release v1.0.4 - Official Signed APK
            - **App Name:** Max AI
            - **Package:** `com.max.ai`
            - **Signing:** Official Release Keystore (`KEYSTORE_BASE64` signed APK)
            
            ### 💎 Key Updates in v1.0.4:
            - 🧹 **Clean & Focused Voice Home Screen:**
              - Removed duplicate tools & automations 6-tile grid from Home screen
              - Streamlined Bottom Navigation Bar to clean 3 tabs: **Voice**, **Chat**, **Settings**
              - Full Tools (19 Active) & Termux Terminal Reel remain fully accessible via Drawer and top AppBar
              - VoiceOrb centerpiece with animated status text & soundwave visualizer
            - 💬 **Personal Messenger Chat Experience:**
              - Full Messenger-style chat capsules with rounded pill borders
              - User message pills on the right with timestamps and double checkmarks (`✓✓`)
              - AI assistant pills on the left with avatar `M`
              - Real-time in-chat typing indicator pill with 3 animated bouncing dots (`• • •`) replacing the bulky bottom bar
            - ⚡ **Exclusively Google Gemini 3.8 Flash:**
              - Model locked strictly to `gemini-3.8-flash` (removed all deprecated models)
              - Smart auto-retry for 503 high-demand spikes
              - Smooth, friendly connection testing in Settings
            
            📥 **Download Signed APK:** Tap `Max-AI-signed-release.apk` below to download and install!
          files: Max-AI-signed-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
